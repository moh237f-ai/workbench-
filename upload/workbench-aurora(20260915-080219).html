function updateAnalogClock(container,date,phaseLabel,remaining,progress,cycle,hasTimer){
  const c=180;
  const h=date.getHours()%12||12,m=date.getMinutes(),s=date.getSeconds();
  const ha=(h*30+m*0.5-90)*Math.PI/180, ma=(m*6+s*0.1-90)*Math.PI/180, sa=(s*6-90)*Math.PI/180;
  const hourEl=container.querySelector('.focus-hand-hour');
  if(hourEl){hourEl.setAttribute('x2',c+Math.cos(ha)*90);hourEl.setAttribute('y2',c+Math.sin(ha)*90);}
  const minEl=container.querySelector('.focus-hand-minute');
  if(minEl){minEl.setAttribute('x2',c+Math.cos(ma)*130);minEl.setAttribute('y2',c+Math.sin(ma)*130);}
  const secEl=container.querySelector('.focus-hand-second');
  if(secEl){secEl.setAttribute('x1',c-Math.cos(sa)*24);secEl.setAttribute('y1',c-Math.sin(sa)*24);secEl.setAttribute('x2',c+Math.cos(sa)*144);secEl.setAttribute('y2',c+Math.sin(sa)*144);}
  if(hasTimer){
    const ring=container.querySelector('.focus-progress-ring');
    if(ring){const rr=c-8;ring.setAttribute('stroke-dasharray',`${2*Math.PI*rr*(progress/100)} ${2*Math.PI*rr}`);}
  }
  updateClockMeta(container,date,phaseLabel,remaining,cycle,hasTimer);
}

function computeFlipDigits(date,remaining,hasTimer){
  const total=hasTimer?Math.max(0,Math.floor(remaining)):((date.getHours()%24)*3600+date.getMinutes()*60+date.getSeconds());
  const h=Math.floor(total/3600),m=Math.floor(total%3600/60),sec=Math.floor(total%60);
  return [h,m,sec].map(v=>String(v).padStart(2,'0')).join('').padStart(6,'0').slice(-6).split('');
}
function buildFlipShell(container,hasTimer,date,remaining){
  const digits=computeFlipDigits(date,remaining||0,hasTimer);
  const groups=[0,2,4];
  const html=groups.map((startIdx,g)=>{
    const units=[0,1].map(off=>{
      const i=startIdx+off,val=digits[i];
      return `<div class="flip-unit no-flip" data-idx="${i}" data-digit="${val}" data-state="static">
        <div class="flip-half flip-top-static"><span>${val}</span></div>
        <div class="flip-half flip-bottom-static"><span>${val}</span></div>
        <div class="flip-shadow"></div>
      </div>`;
    }).join('');
    return `<div class="flip-group">${units}</div>${g<2?'<div class="flip-separator">:</div>':''}`;
  }).join('');
  container.innerHTML=`<div class="flip-clock-wrap">
    <div class="flip-board" aria-label="">${html}</div>
    <div class="flip-label focus-flip-label"></div>
    ${buildClockMetaShell(hasTimer)}
  </div>`;
}
function updateFlipClock(container,date,phaseLabel,remaining,progress,cycle,hasTimer){
  const digits=computeFlipDigits(date,remaining,hasTimer);
  digits.forEach((val,i)=>{
    const unit=container.querySelector(`.flip-unit[data-idx="${i}"]`);
    if(!unit)return;
    const old=unit.dataset.digit;
    const wasFlipping=unit.dataset.state==='flipping';
    if(old===val && !wasFlipping)return;
    if(old===val && wasFlipping){
      unit.dataset.state='static';
      unit.className='flip-unit no-flip';
      unit.innerHTML=`<div class="flip-half flip-top-static"><span>${val}</span></div><div class="flip-half flip-bottom-static"><span>${val}</span></div><div class="flip-shadow"></div>`;
      return;
    }
    unit.dataset.digit=val;
    unit.dataset.state='flipping';
    unit.className='flip-unit';
    unit.innerHTML=`<div class="flip-half flip-top-static"><span>${val}</span></div><div class="flip-half flip-bottom-static"><span>${val}</span></div><div class="flip-half flip-old-top is-flipping"><span>${old}</span></div><div class="flip-half flip-new-bottom is-flipping"><span>${val}</span></div><div class="flip-shadow"></div>`;
  });
  const board=container.querySelector('.flip-board');
  if(board)board.setAttribute('aria-label',digits.slice(0,2).join('')+':'+digits.slice(2,4).join('')+':'+digits.slice(4,6).join(''));
  const lbl=container.querySelector('.focus-flip-label');
  if(lbl)lbl.textContent=`${hasTimer?(phaseLabel==='Focus'?'FOCUS COUNTDOWN':phaseLabel==='Break'?'BREAK COUNTDOWN':'TIMER RUNNING'):'LIVE TIME'}${hasTimer&&cycle>0?` · CYCLE ${cycle}`:''}`;
  updateClockMeta(container,date,phaseLabel,remaining,cycle,hasTimer);
}

function piProjectStats(itemId){

function piBottlenecks(){
  const out=[];
  state.items.filter(i=>i.type==='task'&&i.status!=='done'&&i.status!=='archived').forEach(t=>{
    const deps=(t.dependsOn||[]).map(getItem).filter(Boolean).filter(d=>d.status!=='done');
    if(deps.length)out.push({kind:'blocked',item:t,reason:`Waiting on ${deps.map(d=>d.title).slice(0,2).join(', ')}`});
    else if(t.deadline&&t.deadline<todayStr())out.push({kind:'overdue',item:t,reason:`Overdue since ${t.deadline}`});

function openCompleteIntegrations(){const body=`<div class="suite-list"><div class="suite-row"><div class="suite-row-main"><div class="suite-row-title">Workspace backup</div><div class="suite-row-sub">Export/import goals, tasks, resources, roadmaps, events and review history.</div></div><button class="suite-btn" data-complete-action="export">Export</button><button class="suite-btn" data-complete-action="import">Import</button></div><div class="suite-row"><div class="suite-row-main"><div class="suite-row-title">Calendar bridge</div><div class="suite-row-sub">Move planned work in and out using standard .ics files.</div></div><button class="suite-btn" data-complete-action="ics-export">Export</button><button class="suite-btn" data-complete-action="ics-import">Import</button></div><div class="suite-row"><div class="suite-row-main"><div class="suite-row-title">Cloud sync</div><div class="suite-row-sub">Not connected. The current build is local-first; a backend can be attached later without changing the workspace model.</div></div><span class="chip chip-warn">Local-first</span></div></div>`;openModal('Integrations',body,[{label:'Done',cls:'btn btn-primary',close:true}]);}
const __exportBeforeComplete=exportJSONSuite;exportJSONSuite=function(){ensureCompleteModel();const data={schemaVersion:SCHEMA_VERSION,items:state.items,resources:state.resources,roadmaps:state.roadmaps,labels:state.labels,entries:state.entries,events:state.events,habits:state.habits,journal:state.journal,suite:state.suite,complete:state.complete,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workbench-aurora-complete-'+todayStr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Complete workspace exported');};
function renderReminders(root){const due=activeReminders();const upcoming=state.items.filter(i=>i.reminderAt&&i.status!=='done'&&i.status!=='archived'&&itemReminderStatus(i)==='upcoming').sort((a,b)=>new Date(a.reminderAt)-new Date(b.reminderAt)).slice(0,20);root.innerHTML=`<div class="screen-intro"><div class="screen-copy"><div class="screen-kicker">Reminders</div><h2>Things that need attention.</h2><p>Reminders stay connected to the actual work item.</p></div></div><div class="review-grid"><section class="reminder-panel" style="padding:18px"><div class="card-head"><div><div class="card-title">Due now</div><div class="card-sub">${due.length} item${due.length===1?'':'s'}</div></div></div><div class="reminder-list">${due.map(i=>`<div class="reminder-item"><div class="reminder-main"><div class="reminder-title">${esc(i.title)}</div><div class="reminder-meta">${i.nextAction?esc(i.nextAction):'No next action'} · ${i.priority.toUpperCase()}</div></div><div class="reminder-actions"><button class="btn btn-sm btn-primary" data-reminder-open="${i.id}">Open</button><button class="btn btn-sm" data-reminder-snooze="${i.id}">Snooze 4h</button></div></div>`).join('')||'<div class="empty-state" style="padding:35px">Nothing due right now.</div>'}</div></section><aside class="reminder-panel" style="padding:18px"><div class="card-title">Upcoming</div><div class="reminder-list" style="margin-top:12px">${upcoming.map(i=>`<div class="reminder-item"><div class="reminder-main"><div class="reminder-title">${esc(i.title)}</div><div class="reminder-meta">${fmtDateTime(i.reminderAt)}</div></div><button class="btn btn-sm" data-reminder-open="${i.id}">Edit</button></div>`).join('')||'<div class="empty-state" style="padding:30px">No upcoming reminders.</div>'}</div></aside></div>`;root.querySelectorAll('[data-reminder-open]').forEach(b=>b.addEventListener('click',()=>openReminderEditor(b.dataset.reminderOpen)));root.querySelectorAll('[data-reminder-snooze]').forEach(b=>b.addEventListener('click',()=>snoozeReminder(b.dataset.reminderSnooze)));}
function renderSmartRoadmapTimeline(m){const tasks=m?state.items.filter(i=>m.nodes.some(n=>n.kind!=='resource'&&n.refId===i.id)):state.items.filter(i=>i.type==='task');const start=new Date();start.setHours(0,0,0,0);const days=Array.from({length:14},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});const head=`<div class="roadmap-timeline-grid"><div class="roadmap-timeline-head">Work</div>${days.map(d=>`<div class="roadmap-timeline-head">${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</div>`).join('')}`;const rows=tasks.slice(0,40).map(t=>{const s=t.startDate?new Date(t.startDate):t.deadline?new Date(t.deadline):start;const offset=Math.max(0,Math.min(13,Math.round((s-start)/86400000)));const dur=Math.max(1,Math.ceil((Number(t.estimateMin)||60)/Math.max(1,Number(state.dailyCapacityMin)||240)));return `<div class="roadmap-timeline-grid"><div class="roadmap-timeline-label">${esc(t.title)}</div>${days.map((d,i)=>`<div>${i===offset?`<div class="roadmap-timeline-bar ${t.status==='done'?'done':''}" data-timeline-item="${t.id}" title="${esc(t.title)} · ${Number(t.estimateMin)||60}m"></div>`:''}</div>`).join('')}</div>`;}).join('');return `<div class="roadmap-timeline">${head}${rows}</div>`;}
function renderRoadmapsComplete(root){ensureBatchModel();ensureCompleteModel();let active=state.activeRoadmapId?roadmapById(state.activeRoadmapId):state.roadmaps?.[0];if(!active&&state.roadmaps?.length){active=state.roadmaps[0];state.activeRoadmapId=active.id;}if(!active){renderRoadmaps(root);return;}const view=state.complete.roadmapView||'canvas';root.innerHTML=`<div class="roadmap-toolbar"><div class="roadmap-toolbar-left"><button class="btn btn-primary btn-sm" data-roadmap="create">${I.plus} New roadmap</button><button class="btn btn-sm" data-roadmap="seed">Auto-build</button><button class="btn btn-sm" data-roadmap="add-node">Add node</button><button class="btn btn-sm" data-roadmap="link">Connect</button><button class="btn btn-sm" data-roadmap="system-map">System map</button><div class="roadmap-view-toggle"><button class="${view==='canvas'?'active':''}" data-complete-roadmap-view="canvas">Canvas</button><button class="${view==='timeline'?'active':''}" data-complete-roadmap-view="timeline">Timeline</button></div></div><div class="roadmap-toolbar-right"><span class="chip chip-ok">${active.nodes.length} nodes</span><span class="chip chip-ok">${active.links.length} links</span></div></div><div style="margin-top:14px">${view==='timeline'?renderSmartRoadmapTimeline(active):renderRoadmapCanvas(active)}</div>`;bindCommonActions(root);root.querySelectorAll('[data-complete-roadmap-view]').forEach(b=>b.addEventListener('click',()=>{state.complete.roadmapView=b.dataset.completeRoadmapView;saveDebounced();renderRoadmapsComplete(root);}));root.querySelectorAll('[data-timeline-item]').forEach(b=>b.addEventListener('click',()=>openItemDetail(b.dataset.timelineItem)));}
const __renderBaseComplete=render;
render=function(){ensureCompleteModel();__renderBaseComplete();const content=$('pageContent');if(state.view==='search'){const h=$('pageHeader');h.querySelector('h1').textContent='Search';h.querySelector('.sub').textContent='Find anything in the connected workspace.';content.innerHTML='';renderSearch(content);}else if(state.view==='review'){const h=$('pageHeader');h.querySelector('h1').textContent='Weekly Review';h.querySelector('.sub').textContent='Turn the last week into better decisions.';content.innerHTML='';renderReview(content);}else if(state.view==='reminders'){const h=$('pageHeader');h.querySelector('h1').textContent='Reminders';h.querySelector('.sub').textContent='Attention, anchored to real work.';content.innerHTML='';renderReminders(content);}else if(state.view==='roadmaps'){content.innerHTML='';renderRoadmapsComplete(content);}else if(state.view==='command'){content.insertAdjacentHTML('beforeend',renderIntelligenceBlock());}};
const __setViewComplete=setView;setView=function(v){ensureCompleteModel();__setViewComplete(v);};
if(!NAV.some(n=>n.id==='search'))NAV.push({id:'search',label:'Search',icon:I.sparkle,shortcut:'G /'});if(!NAV.some(n=>n.id==='review'))NAV.push({id:'review',label:'Review',icon:I.chart,shortcut:'G W'});if(!NAV.some(n=>n.id==='reminders'))NAV.push({id:'reminders',label:'Reminders',icon:I.clock,shortcut:'G E'});
const __renderSidebarBeforeComplete=renderSidebar;
renderSidebar=function(){ensureCompleteModel();__renderSidebarBeforeComplete();};
const __bindCommonBeforeComplete=bindCommonActions;
bindCommonActions=function(root){__bindCommonBeforeComplete(root);root.addEventListener('click',e=>{const a=e.target.closest('[data-complete]');if(!a)return;const act=a.dataset.complete;if(act==='review')openWeeklyReview();if(act==='smart')openSmartSchedule();if(act==='reminders')setView('reminders');if(act==='integrations')openCompleteIntegrations();});};
/* global keyboard shortcuts */
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='shift'&&false)return;const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='/'){e.preventDefault();setView('search');setTimeout(()=>$('globalSearchInput')?.focus(),80);}if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&k==='w'){/* harmless when typing */}});
const __openItemDetailCompleteBase=openItemDetail;
openItemDetail=function(id){__openItemDetailCompleteBase(id);setTimeout(()=>{const body=document.querySelector('.modal-body');if(!body||body.querySelector('[data-complete-item-tools]'))return;const bar=document.createElement('div');bar.dataset.completeItemTools='1';bar.className='complete-toolbar';bar.style.margin='12px 0 0';bar.innerHTML='<button class="btn btn-sm" data-complete-item="reminder">Reminder</button><button class="btn btn-sm" data-complete-item="smart">Smart schedule</button>';body.prepend(bar);bar.addEventListener('click',e=>{const a=e.target.closest('[data-complete-item]');if(!a)return;if(a.dataset.completeItem==='reminder')openReminderEditor(id);if(a.dataset.completeItem==='smart'){closeModal();openSmartSchedule();}});},50);};
document.addEventListener('click',e=>{const a=e.target.closest('[data-complete-action]');if(!a)return;const action=a.dataset.completeAction;if(action==='export')exportJSONSuite();if(action==='import' && typeof importJSONSuite==='function')importJSONSuite();if(action==='ics-export' && typeof exportICSSuite==='function')exportICSSuite();if(action==='ics-import')importICS();});

</script>
</body>
