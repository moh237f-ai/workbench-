<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hexGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#2F6F4E"/>
      <stop offset="100%" stop-color="#1D4632"/>
    </linearGradient>
    <radialGradient id="focusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- hexagon frame: the workbench boundary -->
  <path d="M60 9 L103 34.5 L103 85.5 L60 111 L17 85.5 L17 34.5 Z"
        fill="none" stroke="url(#hexGrad)" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- soft glow behind the active/focus node -->
  <circle cx="60" cy="29" r="17" fill="url(#focusGlow)"/>

  <!-- branches: one goal, reaching toward its work -->
  <g stroke="#2F6F4E" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="32"/>
    <line x1="60" y1="60" x2="85" y2="75"/>
    <line x1="60" y1="60" x2="35" y2="75"/>
  </g>

  <!-- hub -->
  <circle cx="60" cy="60" r="8" fill="#1D4632"/>

  <!-- quiet nodes -->
  <circle cx="85" cy="75" r="6.5" fill="#2F6F4E"/>
  <circle cx="35" cy="75" r="6.5" fill="#2F6F4E"/>

  <!-- the node in focus -->
  <circle cx="60" cy="29" r="7.5" fill="#F59E0B"/>
</svg>
